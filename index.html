<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUSHI & WOK - Menú Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 font-sans pb-32">

  <!-- Header del Local -->
  <header class="bg-gray-900 text-white p-5 text-center shadow-lg sticky top-0 z-40">
    <div class="flex justify-center items-center gap-2">
      <span class="text-2xl">🥢</span>
      <h1 class="text-2xl font-black tracking-wide uppercase text-amber-400">SUSHI & WOK</h1>
    </div>
    <p class="text-xs text-gray-300 mt-1">Pide directamente a nuestra cocina por WhatsApp</p>
  </header>

  <!-- Categorías (Scroll Horizontal) -->
  <div class="bg-white border-b border-gray-200 sticky top-[72px] z-30 px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar shadow-xs">
    <button onclick="filterCategory('all')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-white whitespace-nowrap">🔥 Todo</button>
    <button onclick="filterCategory('entradas')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-700 whitespace-nowrap">🥟 Entradas</button>
    <button onclick="filterCategory('wok')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-700 whitespace-nowrap">🥡 Wok</button>
  </div>

  <!-- Contenedor del Menú -->
  <main class="max-w-md mx-auto p-4 space-y-4" id="menu-container">
    <!-- Los productos se inyectan dinámicamente -->
  </main>

  <!-- Modal para Opciones (Carne / Ají / etc.) -->
  <div id="options-modal" class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 space-y-5 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-product-title" class="font-bold text-lg text-gray-900">Personalizar Plato</h3>
        <button onclick="closeModal()" class="text-gray-400 font-bold text-xl px-2">✕</button>
      </div>

      <!-- Selección de Proteína -->
      <div id="protein-section">
        <label class="block text-xs font-extrabold uppercase tracking-wider text-gray-500 mb-2">Selecciona tu Proteína / Carne:</label>
        <div class="space-y-2">
          <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 cursor-pointer hover:bg-amber-50">
            <input type="radio" name="protein-option" value="Carne de Pollo" checked class="accent-amber-500 w-4 h-4">
            <span class="text-sm font-bold text-gray-800">🍗 Carne de Pollo</span>
          </label>
          <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 cursor-pointer hover:bg-amber-50">
            <input type="radio" name="protein-option" value="Carne de Vacuno" class="accent-amber-500 w-4 h-4">
            <span class="text-sm font-bold text-gray-800">🥩 Carne de Vacuno</span>
          </label>
        </div>
      </div>

      <!-- Opción de Ají -->
      <div id="chili-section">
        <label class="block text-xs font-extrabold uppercase tracking-wider text-gray-500 mb-2">Picante / Ají:</label>
        <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 cursor-pointer hover:bg-amber-50">
          <input type="checkbox" id="add-chili-check" class="accent-amber-500 w-4 h-4">
          <span class="text-sm font-bold text-gray-800">🌶️ Agregar Ají</span>
        </label>
      </div>

      <button onclick="confirmCustomizedProduct()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black py-3.5 rounded-2xl shadow-lg transition-all active:scale-95">
        Agregar al Pedido
      </button>
    </div>
  </div>

  <!-- Barra Flotante Inferior -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 max-w-md mx-auto shadow-2xl z-40 flex justify-between items-center">
    <div>
      <span class="text-xs text-gray-400 font-medium block">Total pedido:</span>
      <span id="cart-total" class="text-2xl font-black text-gray-900">$0</span>
    </div>
    <button onclick="sendOrderToWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition-all text-white font-bold py-3 px-5 rounded-2xl flex items-center gap-2 shadow-lg shadow-emerald-600/20">
      <span>📲 Pedir por WhatsApp</span>
    </button>
  </div>

  <script>
    const WHATSAPP_PHONE = "56932649489";

    const products = [
      // ENTRADAS
      {
        id: 1,
        category: "entradas",
        name: "CHICKEN CRISPY",
        desc: "Jugosas tiras de pollo crujientes, sazonadas con especias selectas. Pack de 6 unidades.",
        price: 6690,
        badge: "Popular",
        img: "https://assets.olaclick.app/companies/products/images/800/7d7ccda4-7772-4aa5-b463-d98c84228a01.png"
      },
      {
        id: 2,
        category: "entradas",
        name: "POLLO FRITO",
        desc: "Crujientes tiras de pollo fritas en panko, 6 unidades por porción.",
        price: 6000,
        img: "https://assets.olaclick.app/companies/products/images/800/1cc91131-7283-43a0-bacb-471737445736.png"
      },
      {
        id: 3,
        category: "entradas",
        name: "EMPANADAS POLLO MANDARIN",
        desc: "Empanaditas fritas de pollo con cebollín, 5 unidades por porción.",
        price: 4000,
        img: "https://assets.olaclick.app/companies/products/images/800/5a0d06f5-f9d1-4a7d-be1d-507310b6c388.png"
      },
      {
        id: 4,
        category: "entradas",
        name: "CAMARON FURAY",
        desc: "Crujientes camarones en Panko, fritos a la perfección. 6 unidades.",
        price: 6000,
        img: "https://assets.olaclick.app/companies/products/images/800/8048be17-2938-4155-8f89-d9f7a8b07b7d.png"
      },
      {
        id: 5,
        category: "entradas",
        name: "CAMARON TEMPURIZADO",
        desc: "Camarones apanados en tempura fritos. 6 unidades por porción.",
        price: 6000,
        img: "https://assets.olaclick.app/companies/products/images/800/6ab684af-8272-494b-b411-bb5248566514.jfif"
      },
      {
        id: 6,
        category: "entradas",
        name: "ARROLLADO JAMON QUESO",
        desc: "Fina masa de harina rellena de jamón y queso mantecoso. 5 unidades.",
        price: 3500,
        img: "https://assets.olaclick.app/companies/products/images/800/94509cae-104c-4002-aae1-acb106c27843.png"
      },
      {
        id: 7,
        category: "entradas",
        name: "ARROLLADO PRIMAVERA",
        desc: "Fina masa dorada crujiente rellena de zanahoria y pollo. 5 unidades.",
        price: 3000,
        img: "https://assets.olaclick.app/companies/products/images/800/b35063a4-1543-41ba-abb2-e6b4bab22396.png"
      },
      {
        id: 8,
        category: "entradas",
        name: "FINGER DE QUESO",
        desc: "Palitos de queso artesanal crujientes fritos en panko. 6 unidades.",
        price: 5000,
        img: "https://assets.olaclick.app/companies/products/images/800/ae66e983-6cf6-4be7-b92d-9f1c99cb49a2.png"
      },
      {
        id: 9,
        category: "entradas",
        name: "SHRIMP MAKI",
        desc: "Camarones apanados envueltos en salmón con toques de queso crema bañados en salsa agridulce. 4 unidades.",
        price: 6500,
        badge: "Recomendado",
        img: "https://assets.olaclick.app/companies/products/images/800/d9281376-00b4-4619-b4d1-2e265706387a.png"
      },
      {
        id: 10,
        category: "entradas",
        name: "EMPANADAS QUESO",
        desc: "Empanadas de queso crocantes y cremosas. 3 unidades.",
        price: 2000,
        img: "https://assets.olaclick.app/companies/products/images/800/2574fb41-91da-4950-9308-52049c3d3181.jpg"
      },

      // WOK & COLACIONES
      {
        id: 11,
        category: "wok",
        name: "COLACION MONGOLIANA",
        desc: "Salteado Mongoliano servido con arroz chaufán y 2 arrollados crujientes. ¡Elige tu carne y opcional ají!",
        price: 6000,
        badge: "Popular",
        hasOptions: true,
        img: "https://assets.olaclick.app/companies/products/images/800/ffdfeb38-be15-4989-9f07-abcf64b3d150.png"
      },
      {
        id: 12,
        category: "wok",
        name: "COLACION CHOP SUEY",
        desc: "Salteado de verduras + arroz chaufán + 2 arrollados. ¡Elige tu carne y opcional ají!",
        price: 5500,
        badge: "Especial",
        hasOptions: true,
        img: "https://assets.olaclick.app/companies/products/images/800/67b2fbb4-6c4d-49c9-949b-f05a1baf35dd.jpeg"
      },
      {
        id: 13,
        category: "wok",
        name: "PORCION DE ARROZ",
        desc: "Porción de arroz (250 grs aprox).",
        price: 2000,
        img: "https://assets.olaclick.app/companies/products/images/800/66335b29-9a5e-4c57-899e-3141ee4d39be.jpg"
      }
    ];

    let cartList = [];
    let activeProductForModal = null;

    function renderMenu(filter = "all") {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

      filtered.forEach(p => {
        const count = cartList.filter(item => item.id === p.id).reduce((sum, item) => sum + item.qty, 0);

        container.innerHTML += `
          <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-xs flex gap-3 items-center">
            <img src="${p.img}" alt="${p.name}" class="w-24 h-24 object-cover rounded-xl bg-gray-100">
            <div class="flex-1 min-w-0">
              ${p.badge ? `<span class="bg-amber-100 text-amber-700 text-[10px] font-extrabold px-2 py-0.5 rounded-md uppercase">${p.badge}</span>` : ''}
              <h3 class="font-bold text-gray-800 text-sm truncate mt-0.5">${p.name}</h3>
              <p class="text-xs text-gray-400 line-clamp-2 mt-0.5 leading-relaxed">${p.desc}</p>
              <div class="flex justify-between items-center mt-2">
                <span class="font-black text-gray-900 text-sm">$${p.price.toLocaleString('es-CL')}</span>
                <div class="flex items-center gap-2 bg-gray-100 p-1 rounded-xl">
                  ${p.hasOptions ? `
                    <button onclick="openModal(${p.id})" class="bg-amber-500 text-white font-extrabold text-xs px-3 py-1 rounded-lg shadow-2xs active:scale-95">
                      + Personalizar ${count > 0 ? `(${count})` : ''}
                    </button>
                  ` : `
                    <button onclick="updateSimpleQty(${p.id}, -1)" class="w-6 h-6 rounded-lg bg-white shadow-2xs flex items-center justify-center font-bold text-gray-700 text-xs active:scale-95">-</button>
                    <span class="text-xs font-bold w-4 text-center">${count}</span>
                    <button onclick="updateSimpleQty(${p.id}, 1)" class="w-6 h-6 rounded-lg bg-gray-900 text-white shadow-2xs flex items-center justify-center font-bold text-xs active:scale-95">+</button>
                  `}
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function openModal(productId) {
      activeProductForModal = products.find(p => p.id === productId);
      document.getElementById('modal-product-title').innerText = activeProductForModal.name;
      document.getElementById('add-chili-check').checked = false;
      document.getElementById('options-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('options-modal').classList.add('hidden');
      activeProductForModal = null;
    }

    function confirmCustomizedProduct() {
      if (!activeProductForModal) return;

      const selectedProtein = document.querySelector('input[name="protein-option"]:checked').value;
      const addChili = document.getElementById('add-chili-check').checked;

      let detail = `(${selectedProtein}`;
      if (addChili) detail += ` + con Ají🌶️`;
      detail += `)`;

      cartList.push({
        id: activeProductForModal.id,
        name: activeProductForModal.name,
        price: activeProductForModal.price,
        qty: 1,
        detail: detail
      });

      closeModal();
      renderMenu();
      updateTotal();
    }

    function updateSimpleQty(productId, change) {
      const p = products.find(prod => prod.id === productId);
      const existingIndex = cartList.findIndex(item => item.id === productId);

      if (change > 0) {
        if (existingIndex >= 0) {
          cartList[existingIndex].qty += 1;
        } else {
          cartList.push({ id: p.id, name: p.name, price: p.price, qty: 1, detail: "" });
        }
      } else if (change < 0 && existingIndex >= 0) {
        cartList[existingIndex].qty -= 1;
        if (cartList[existingIndex].qty <= 0) {
          cartList.splice(existingIndex, 1);
        }
      }

      renderMenu();
      updateTotal();
    }

    function updateTotal() {
      const total = cartList.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cart-total').innerText = '$' + total.toLocaleString('es-CL');
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-white');
        btn.classList.add('bg-gray-100', 'text-gray-700');
      });
      event.target.classList.remove('bg-gray-100', 'text-gray-700');
      event.target.classList.add('bg-amber-500', 'text-white');
      renderMenu(cat);
    }

    function sendOrderToWhatsApp() {
      if (cartList.length === 0) {
        alert("Por favor selecciona al menos un producto.");
        return;
      }

      let text = "🥢 *NUEVO PEDIDO - SUSHI & WOK*\n";
      text += "----------------------------------\n";
      let total = 0;

      cartList.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        text += `• ${item.qty}x ${item.name} ${item.detail} ($${itemTotal.toLocaleString('es-CL')})\n`;
      });

      text += "----------------------------------\n";
      text += `💰 *TOTAL ESTIMADO:* *$${total.toLocaleString('es-CL')}*\n\n`;
      text += "👤 *Nombre:* \n";
      text += "📍 *Dirección de entrega / Retiro:* ";

      const url = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    renderMenu('all');
  </script>
</body>
</html>
