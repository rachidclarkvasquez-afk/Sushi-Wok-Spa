<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUSHI & WOK - Menú Online</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans pb-24">

  <!-- ENCABEZADO -->
  <header class="bg-gray-900/90 backdrop-blur border-b border-gray-800 sticky top-0 z-40 p-4 shadow-xl">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-amber-400 flex items-center gap-2">
          🥢 SUSHI & WOK
        </h1>
        <p class="text-[11px] text-gray-400">Av. Ramón Picarte 3045, Valdivia</p>
      </div>
      <div id="schedule-badge" class="text-[10px] font-extrabold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
        🟢 Abierto
      </div>
    </div>
  </header>

  <!-- REPRODUCTOR / BUSCADOR / CATEGORÍAS -->
  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- BUSCADOR -->
    <div class="relative">
      <input type="text" id="client-search" oninput="filterMenu()" placeholder="🔍 Buscar tu plato favorito (ej: rolls, wok, tempura)..." 
        class="w-full bg-gray-900 border border-gray-800 text-white placeholder-gray-500 text-xs sm:text-sm p-3.5 rounded-2xl focus:outline-none focus:border-amber-500 transition-all shadow-inner">
    </div>

    <!-- CATEGORÍAS -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="category-bar">
      <button onclick="selectCategory('Todas')" class="cat-btn bg-amber-500 text-gray-950 font-black px-4 py-2 rounded-xl text-xs whitespace-nowrap shadow-md">Todas</button>
    </div>

    <!-- CONTENEDOR DE PRODUCTOS -->
    <div id="client-menu-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <p class="col-span-full text-center text-gray-500 py-12 font-bold animate-pulse">Cargando la carta exquisita... 🥢</p>
    </div>

  </main>

  <!-- BARRA FLOTANTE DE CARRITO -->
  <div id="cart-bar" class="fixed bottom-4 left-4 right-4 max-w-xl mx-auto bg-amber-500 text-gray-950 p-4 rounded-2xl shadow-2xl flex justify-between items-center z-50 hidden cursor-pointer" onclick="openCartModal()">
    <div class="flex items-center gap-3">
      <span id="cart-count" class="bg-gray-950 text-amber-400 font-black text-xs px-2.5 py-1 rounded-xl">0</span>
      <span class="font-black text-sm">Ver mi Pedido</span>
    </div>
    <span id="cart-total" class="font-black text-base sm:text-lg">$0</span>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://sushi-wok-89bee-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let clientProducts = [];
    let selectedCat = 'Todas';
    let cart = [];

    // Cargar menú desde Firebase
    db.ref('menu').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        // Asegura formato Array
        clientProducts = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
        renderCategories();
        filterMenu();
      } else {
        document.getElementById('client-menu-container').innerHTML = `
          <div class="col-span-full text-center text-gray-500 py-12 font-bold">
            No hay productos cargados en el menú aún.
          </div>`;
      }
    });

    function renderCategories() {
      const categories = ['Todas', ...new Set(clientProducts.map(p => p.category).filter(Boolean))];
      const bar = document.getElementById('category-bar');
      bar.innerHTML = categories.map(cat => `
        <button onclick="selectCategory('${cat}')" class="cat-btn ${cat === selectedCat ? 'bg-amber-500 text-gray-950 font-black' : 'bg-gray-900 text-gray-300 hover:bg-gray-800 font-bold'} px-4 py-2 rounded-xl text-xs whitespace-nowrap shadow-md transition-all">
          ${cat}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      selectedCat = cat;
      renderCategories();
      filterMenu();
    }

    function filterMenu() {
  const container = document.getElementById('client-menu-container');
  container.innerHTML = '';

  if (!clientProducts || clientProducts.length === 0) {
    container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-12 font-bold">No hay productos en la variable...</div>`;
    return;
  }

  // Muestra todos los productos directamente sin filtros estrictos para probar
  clientProducts.forEach(p => {
    if (!p) return;
    container.innerHTML += `
      <div class="bg-gray-900 rounded-2xl p-3.5 border border-gray-800 shadow-lg flex gap-3 items-center">
        <img src="${p.img || 'https://via.placeholder.com/150'}" class="w-20 h-20 rounded-xl object-cover bg-gray-800 flex-shrink-0">
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-white text-sm truncate">${p.name || 'Sin nombre'}</h3>
          <p class="text-[11px] text-gray-400 line-clamp-2 mt-0.5">${p.description || p.category || ''}</p>
          <div class="flex justify-between items-center mt-2">
            <span class="font-black text-amber-400 text-sm">$${(p.price || 0).toLocaleString('es-CL')}</span>
            <button onclick="addToCart(${p.id})" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-black text-xs px-3 py-1.5 rounded-xl transition-all shadow-md active:scale-95">
              + Agregar
            </button>
          </div>
        </div>
      </div>
    `;
  });
}

    function addToCart(prodId) {
      const prod = clientProducts.find(p => p.id === prodId);
      if (!prod) return;

      const item = cart.find(i => i.id === prodId);
      if (item) {
        item.qty += 1;
      } else {
        cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
      }
      updateCartBar();
    }

    function updateCartBar() {
      const bar = document.getElementById('cart-bar');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');

      const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
      const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      if (totalQty > 0) {
        bar.classList.remove('hidden');
        countEl.innerText = totalQty;
        totalEl.innerText = '$' + totalPrice.toLocaleString('es-CL');
      } else {
        bar.classList.add('hidden');
      }
    }

    function openCartModal() {
      alert("Aquí se abre el modal para ingresar los datos del pedido.");
    }
  </script>
</body>
</html>
