<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital - Sushi & Wok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 font-sans pb-32">

  <!-- Header del Local -->
  <header class="bg-gray-900 text-white p-5 text-center shadow-lg sticky top-0 z-40">
    <div class="flex justify-center items-center gap-2">
      <span class="text-2xl">🥢</span>
      <h1 class="text-2xl font-black tracking-wide uppercase text-amber-400">Sushi & Wok</h1>
    </div>
    <p class="text-xs text-gray-300 mt-1">Haz tu pedido directo a nuestra cocina por WhatsApp</p>
  </header>

  <!-- Filtro por Categorías (Scroll Horizontal) -->
  <div class="bg-white border-b border-gray-200 sticky top-[72px] z-30 px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar shadow-2xs">
    <button onclick="filterCategory('all')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-white whitespace-nowrap">🔥 Todo</button>
    <button onclick="filterCategory('combos')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-700 whitespace-nowrap">🍱 Combos & Promos</button>
    <button onclick="filterCategory('rolls')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-700 whitespace-nowrap">🍣 Sushi Rolls</button>
    <button onclick="filterCategory('wok')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-700 whitespace-nowrap">🍜 Wok & Salteados</button>
    <button onclick="filterCategory('bebidas')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-700 whitespace-nowrap">🥤 Bebidas</button>
  </div>

  <!-- Contenedor del Menú -->
  <main class="max-w-md mx-auto p-4 space-y-4" id="menu-container">
    <!-- Los productos se inyectan dinámicamente aquí -->
  </main>

  <!-- Barra Flotante Inferior -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 max-w-md mx-auto shadow-2xl z-40 flex justify-between items-center">
    <div>
      <span class="text-xs text-gray-400 font-medium block">Total estimado:</span>
      <span id="cart-total" class="text-2xl font-black text-gray-900">$0</span>
    </div>
    <button onclick="sendOrderToWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition-all text-white font-bold py-3 px-5 rounded-2xl flex items-center gap-2 shadow-lg shadow-emerald-600/20">
      <span>📲 Pedir por WhatsApp</span>
    </button>
  </div>

  <script>
    // 1. CONFIGURA TU TELÉFONO AQUÍ (Código de país + número sin espacios ni +)
    const WHATSAPP_PHONE = "56912345678";

    // 2. TUS PRODUCTOS (Estructura tipo Sushi Wok)
    const products = [
      {
        id: 1,
        category: "combos",
        name: "Combo Mix 30 Piezas",
        desc: "10 Avocado Roll + 10 California Ebi + 10 Hosomaki Salmón.",
        price: 14900,
        badge: "Más Vendido",
        img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=300&auto=format&fit=crop&q=80"
      },
      {
        id: 2,
        category: "rolls",
        name: "Ebi Tempura Roll (10 pzs)",
        desc: "Camarón furai, queso crema y palta, envuelto en sésamo o ciboulette.",
        price: 5800,
        img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=300&auto=format&fit=crop&q=80"
      },
      {
        id: 3,
        category: "rolls",
        name: "Sake Special Roll (10 pzs)",
        desc: "Salmón, queso crema y palta, envuelto en salmón flameado con salsa teriyaki.",
        price: 6500,
        img: "https://images.unsplash.com/photo-1553621042-f6e147245754?w=300&auto=format&fit=crop&q=80"
      },
      {
        id: 4,
        category: "wok",
        name: "Pad Thai Pollo & Camarón",
        desc: "Fideos de arroz, verduras salteadas al wok, huevo, maní picado y salsa tamarindo.",
        price: 7200,
        img: "https://images.unsplash.com/photo-1559847844-5315695dadae?w=300&auto=format&fit=crop&q=80"
      },
      {
        id: 5,
        category: "bebidas",
        name: "Bebida Lata 350ml",
        desc: "Coca-Cola, Sprite o Fanta bien fría.",
        price: 1500,
        img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300&auto=format&fit=crop&q=80"
      }
    ];

    let cart = {};

    // Renderizar menú
    function renderMenu(filter = "all") {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

      filtered.forEach(p => {
        const qty = cart[p.id] || 0;
        container.innerHTML += `
          <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-xs flex gap-3 items-center">
            <img src="${p.img}" alt="${p.name}" class="w-24 h-24 object-cover rounded-xl bg-gray-100">
            <div class="flex-1 min-w-0">
              ${p.badge ? `<span class="bg-amber-100 text-amber-700 text-[10px] font-extrabold px-2 py-0.5 rounded-md uppercase">${p.badge}</span>` : ''}
              <h3 class="font-bold text-gray-800 text-sm truncate mt-0.5">${p.name}</h3>
              <p class="text-xs text-gray-400 line-clamp-2 mt-0.5 leading-relaxed">${p.desc}</p>
              <div class="flex justify-between items-center mt-2">
                <span class="font-black text-gray-900 text-sm">$${p.price.toLocaleString()}</span>
                <div class="flex items-center gap-2 bg-gray-100 p-1 rounded-xl">
                  <button onclick="updateQty(${p.id}, -1)" class="w-6 h-6 rounded-lg bg-white shadow-2xs flex items-center justify-center font-bold text-gray-700 text-xs active:scale-95">-</button>
                  <span id="qty-${p.id}" class="text-xs font-bold w-4 text-center">${qty}</span>
                  <button onclick="updateQty(${p.id}, 1)" class="w-6 h-6 rounded-lg bg-gray-900 text-white shadow-2xs flex items-center justify-center font-bold text-xs active:scale-95">+</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function updateQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] < 0) cart[id] = 0;
      document.getElementById(`qty-${id}`).innerText = cart[id];
      updateTotal();
    }

    function updateTotal() {
      let total = 0;
      products.forEach(p => {
        if (cart[p.id]) total += p.price * cart[p.id];
      });
      document.getElementById('cart-total').innerText = '$' + total.toLocaleString();
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-white');
        btn.classList.add('bg-gray-100', 'text-gray-700');
      });
      event.target.classList.remove('bg-gray-100', 'text-gray-700');
      event.target.classList.add('bg-amber-500', 'text-white');
      renderMenu(cat);
    }

    function sendOrderToWhatsApp() {
      let text = "🍣 *NUEVO PEDIDO SUSHI & WOK*\n";
      text += "----------------------------------\n";
      let total = 0;
      let count = 0;

      products.forEach(p => {
        if (cart[p.id] && cart[p.id] > 0) {
          count++;
          const itemTotal = p.price * cart[p.id];
          total += itemTotal;
          text += `• ${cart[p.id]}x ${p.name} ($${itemTotal.toLocaleString()})\n`;
        }
      });

      if (count === 0) {
        alert("Por favor selecciona al menos un plato para tu pedido.");
        return;
      }

      text += "----------------------------------\n";
      text += `💰 *TOTAL A PAGAR:* *$${total.toLocaleString()}*\n\n`;
      text += "👤 *Nombre:* (Escribe tu nombre aquí)\n";
      text += "📍 *Dirección o Retiro:* ";

      const url = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    // Cargar menú al iniciar
    renderMenu('all');
  </script>
</body>
</html>
